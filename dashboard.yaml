# Holiday Lair - a dark pine-green holiday dashboard for Home Assistant.
# Paste into: Settings > Dashboards > (new dashboard, URL "holiday-lair") > Edit > Raw configuration editor.
# Replace the placeholder entity IDs with your own (see SETUP.md). Requires the HACS cards listed in SETUP.md.
# Art: copy assets/ to /config/www/holiday-lair/ (served as /local/holiday-lair/...).
# Theme: themes/holiday-pine.yaml. Every view sets theme: holiday-pine.
title: Holiday Lair
kiosk_mode:
  mobile_settings:
    hide_header: true
    kiosk: true
button_card_templates:
  hl_base:
    styles:
      card:
        - font-family: "-apple-system,BlinkMacSystemFont,\"SF Pro Text\",Inter,system-ui,sans-serif"
        - border: none
        - box-shadow: "0 8px 18px rgba(0,0,0,.18)"
  hl_header:
    template: hl_base
    show_icon: false
    show_name: false
    variables:
      title: Room
      subtitle: ""
      back: "/holiday-lair/home"
      art: "/local/holiday-lair/header-pines.svg"
    tap_action:
      action: navigate
      navigation_path: "[[[ return variables.back ]]]"
    hold_action:
      action: none
    custom_fields:
      h: "[[[ return `<div class=\"head\"><div class=\"back\"><ha-icon icon=\"mdi:chevron-left\"></ha-icon></div><div><div class=\"title\">${variables.title}</div><div class=\"sub\">${variables.subtitle}</div></div></div>`; ]]]"
    styles:
      card:
        - height: "116px"
        - padding: "12px 16px"
        - border-radius: "0 0 20px 20px"
        - background: "[[[ return `linear-gradient(90deg,rgba(3,29,18,.98) 0%,rgba(3,29,18,.90) 42%,rgba(3,29,18,.25) 72%,rgba(3,29,18,.05) 100%),url(${variables.art}) right center/cover no-repeat` ]]]"
        - margin-bottom: "14px"
      grid:
        - grid-template-areas: "\"h\""
    extra_styles: |
      .head{display:grid;grid-template-columns:42px minmax(0,1fr);gap:11px;align-items:center;text-align:left}
      .back{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#245D3D,#17472F);display:flex;align-items:center;justify-content:center;color:#F4F0E4;border:1px solid rgba(211,168,85,.52)}
      .back ha-icon{--mdc-icon-size:27px}
      .title{font-size:27px;line-height:1;font-weight:740;letter-spacing:-.7px;color:#F4F0E4}
      .sub{margin-top:4px;font-size:12.5px;font-weight:560;color:#C9D3C6}
  hl_tile:
    template: hl_base
    variables:
      path: "/holiday-lair/home"
    show_label: true
    tap_action:
      action: navigate
      navigation_path: "[[[ return variables.path ]]]"
    hold_action:
      action: none
    styles:
      card:
        - height: "92px"
        - padding: "12px"
        - border-radius: "18px"
        - background: "linear-gradient(145deg,rgba(31,83,54,.92),rgba(16,61,43,.96))"
      grid:
        - grid-template-areas: "\"i\" \"n\" \"l\""
        - grid-template-rows: "32px auto auto"
        - justify-items: start
      icon:
        - width: "26px"
        - color: "#D3A855"
      name:
        - font-size: "15px"
        - font-weight: "700"
        - color: "#F4F0E4"
      label:
        - font-size: "12px"
        - font-weight: "560"
        - color: "#C9D3C6"
  hl_toggle:
    template: hl_tile
    tap_action:
      action: toggle
    hold_action:
      action: more-info
    label: "[[[ return entity ? (entity.state === 'on' ? 'On' : entity.state === 'off' ? 'Off' : 'Unavailable') : 'Missing entity' ]]]"
    state:
      - value: "on"
        styles:
          card:
            - background: "linear-gradient(145deg,#C99A3E,#A8761F)"
          icon:
            - color: "#1B140A"
          name:
            - color: "#1B140A"
          label:
            - color: "#1B140A"
  hl_scene:
    template: hl_tile
    tap_action:
      action: perform-action
      perform_action: scene.turn_on
      target:
        entity_id: "[[[ return entity.entity_id ]]]"
    hold_action:
      action: more-info
    # Same box as hl_tile / hl_toggle (92px). Scenes have no state line, so pack
    # the icon and name to the top and leave the state-line slot empty. Otherwise
    # an active tree tile, which shows "On", is taller than Cozy / Party / Night.
    show_label: false
    styles:
      grid:
        - grid-template-rows: "32px min-content min-content"
        - align-content: start
  hl_section:
    show_icon: false
    show_name: true
    tap_action:
      action: none
    hold_action:
      action: none
    styles:
      card:
        - background: transparent
        - border: none
        - box-shadow: none
        - padding: "14px 4px 6px"
      name:
        - justify-self: start
        - font-size: "19px"
        - font-weight: "740"
        - color: "#F4F0E4"
        - font-family: "-apple-system,BlinkMacSystemFont,\"SF Pro Text\",Inter,system-ui,sans-serif"
  hl_action:
    template: hl_base
    show_label: false
    styles:
      card:
        - height: "64px"
        - border-radius: "16px"
        - padding: "8px"
        - background: "rgba(16,61,43,.96)"
      icon:
        - width: "22px"
        - color: "#D3A855"
      name:
        - font-size: "13px"
        - font-weight: "680"
        - color: "#F4F0E4"
views:
  - title: Holiday Lair
    path: home
    icon: "mdi:pine-tree"
    theme: holiday-pine
    type: "custom:grid-layout"
    background: "radial-gradient(circle at 88% 7%,rgba(104,159,78,.20),transparent 30%),radial-gradient(circle at 12% 74%,rgba(195,155,51,.07),transparent 28%),linear-gradient(180deg,#062617 0%,#0a321f 58%,#061f15 100%)"
    layout:
      grid-template-columns: "minmax(0, 430px)"
      justify-content: center
      margin: "0"
      padding: "0 0 28px"
      grid-gap: "0"
    cards:
      - type: vertical-stack
        cards:
          - type: "custom:button-card"
            template: hl_base
            show_icon: false
            show_name: false
            tap_action:
              action: none
            hold_action:
              action: none
            custom_fields:
              greeting: "[[[ const h=new Date().getHours(); const sal=h<12?'Good morning,':h<17?'Good afternoon,':'Good evening,'; const who=((typeof user!=='undefined'&&user&&user.name)||'friend').split(' ')[0]; return `<div class=\"sal\">${sal}</div><div class=\"who\">${who}</div>`; ]]]"
              lair: Holiday Lair
              menu:
                card:
                  type: "custom:button-card"
                  icon: "mdi:cog-outline"
                  show_name: false
                  tap_action:
                    action: navigate
                    navigation_path: "/holiday-lair/menu"
                  styles:
                    card:
                      - height: "44px"
                      - width: "44px"
                      - border-radius: "50%"
                      - background: "rgba(8,30,20,.85)"
                      - border: none
                      - padding: "10px"
                    icon:
                      - color: "#F4F0E4"
                      - width: "24px"
            styles:
              card:
                - height: "220px"
                - padding: "18px 20px"
                - border-radius: "0"
                - box-shadow: none
                - background: "linear-gradient(90deg,#031b11 0%,#031b11 38%,rgba(3,29,18,.85) 52%,rgba(3,27,17,.05) 78%),url(/local/holiday-lair/hero-cabin.svg) right center/cover no-repeat"
                - position: relative
              grid:
                # button-card's vertical layout gives the first row 1fr, which
                # dropped "Holiday Lair" onto the snow and against the status pill.
                # Both rows stay content-sized so the title sits under the name,
                # on the night sky (#D3A855 on #031B11).
                - grid-template-areas: "\"greeting\" \"lair\""
                - grid-template-columns: "minmax(0, 58%)"
                - grid-template-rows: "min-content min-content"
                - align-content: start
                - justify-content: start
                - justify-items: start
                - row-gap: "14px"
              custom_fields:
                greeting:
                  - color: "#FFFDF4"
                  - text-align: left
                  - align-self: start
                  - text-shadow: "0 2px 8px rgba(0,0,0,.34)"
                lair:
                  - color: "#D3A855"
                  - font-size: "18px"
                  - font-weight: "650"
                  - line-height: "1.2"
                  - align-self: start
                  - justify-self: start
                menu:
                  - position: absolute
                  - right: "14px"
                  - top: "max(14px, env(safe-area-inset-top))"
            extra_styles: |
              .sal{font-size:20px;font-weight:550;line-height:1.3}
              .who{font-size:34px;font-weight:760;line-height:1.1;margin-top:4px;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px !important; margin-top: -26px !important; position: relative; z-index: 2; }"
            card:
              type: "custom:button-card"
              show_icon: false
              show_name: false
              tap_action:
                action: navigate
                navigation_path: "/holiday-lair/security"
              hold_action:
                action: none
              custom_fields:
                weather: "[[[ const t=states['weather.home']?.attributes?.temperature; return `<b>${(t===undefined||t===null)?'—':Math.round(t)+'°'}</b><small>Outside</small>`; ]]]"
                alarm: "[[[ const s=states['alarm_control_panel.alarm']?.state; const l=s==='armed_home'?'Armed home':s==='armed_away'?'Armed away':s==='disarmed'?'Disarmed':s?String(s).replaceAll('_',' '):'Unknown'; return `<b>${l}</b><small>Alarm</small>`; ]]]"
                locks: "[[[ const ids=['lock.front_door_lock', 'lock.back_door_lock']; const v=ids.map(i=>states[i]).filter(x=>x&&!['unknown','unavailable'].includes(x.state)); const n=v.filter(x=>x.state==='locked').length; return `<b>${v.length?n+' of '+v.length:'—'}</b><small>Locked</small>`; ]]]"
              styles:
                card:
                  - height: "56px"
                  - background: "#FFFDF7"
                  - border: none
                  - border-radius: "17px"
                  - box-shadow: "0 5px 8px rgba(0,17,8,.22)"
                  - font-family: "-apple-system,BlinkMacSystemFont,\"SF Pro Text\",Inter,system-ui,sans-serif"
                grid:
                  - grid-template-areas: "\"weather alarm locks\""
                  - grid-template-columns: "1fr 1fr 1fr"
                custom_fields:
                  weather:
                    - color: "#18221B"
                    - font-size: "14px"
                    - line-height: "1.15"
                  alarm:
                    - color: "#18221B"
                    - font-size: "14px"
                    - line-height: "1.15"
                  locks:
                    - color: "#18221B"
                    - font-size: "14px"
                    - line-height: "1.15"
              extra_styles: |
                b{display:block;font-weight:760}
                small{display:block;font-size:11px;color:#4F5A51;margin-top:3px;font-weight:600}
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
            card:
              type: "custom:button-card"
              template: hl_section
              name: "Scenes & holiday"
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
            card:
              type: grid
              columns: 4
              square: false
              cards:
                - type: "custom:button-card"
                  template: hl_scene
                  entity: scene.cozy_evening
                  name: Cozy
                  icon: "mdi:sofa-outline"
                - type: "custom:button-card"
                  template: hl_scene
                  entity: scene.holiday_party
                  name: Party
                  icon: "mdi:party-popper"
                - type: "custom:button-card"
                  template: hl_scene
                  entity: scene.goodnight
                  name: Night
                  icon: "mdi:weather-night"
                - type: "custom:button-card"
                  template: hl_toggle
                  entity: light.tree_lights
                  name: Tree
                  icon: "mdi:pine-tree"
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
            card:
              type: "custom:button-card"
              template: hl_tile
              name: Talk to Assist
              icon: "mdi:microphone"
              label: Tap to talk
              tap_action:
                action: assist
                start_listening: true
              styles:
                card:
                  - height: "64px"
                grid:
                  - grid-template-areas: "\"i n\" \"i l\""
                  - grid-template-columns: "40px 1fr"
                  - grid-template-rows: auto auto
                name:
                  - justify-self: start
                label:
                  - justify-self: start
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 0 !important; }"
            card:
              type: "custom:button-card"
              template: hl_section
              name: Home
          - type: "custom:mod-card"
            card_mod:
              style: "ha-card { background: transparent !important; border: none !important; box-shadow: none !important; padding: 0 16px 24px !important; }"
            card:
              type: grid
              columns: 2
              square: false
              cards:
                - type: "custom:button-card"
                  template: hl_tile
                  name: Lights
                  label: "Rooms & holiday"
                  icon: "mdi:lightbulb-group"
                  variables:
                    path: "/holiday-lair/lights"
                - type: "custom:button-card"
